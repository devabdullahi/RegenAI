[tool.poetry]
name = "regenai-backend"
version = "0.1.0"
description = "RegenAI — AI platform for regenerative agriculture"
authors = ["RegenAI Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
pydantic = "^2.0"
pydantic-settings = "^2.0"
supabase = "^2.0"
httpx = "^0.28"
slowapi = "^0.1.9"
python-dotenv = "^1.0"
anthropic = "^0.49"
weasyprint = "^63"
resend = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
ruff = "^0.8"
mypy = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
