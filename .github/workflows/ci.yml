name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values — app/config.py refuses to start without these.
      SUPABASE_URL: https://ci-dummy.supabase.co
      SUPABASE_ANON_KEY: ci-dummy-anon-key
      DEEPSEEK_API_KEY: ci-dummy-deepseek-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        # poetry.lock is lock-version 2.1 (generated by Poetry 2.3.3); Poetry 1.x cannot read it.
        run: pipx install poetry==2.3.3

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.11-${{ hashFiles('backend/poetry.lock', 'backend/pyproject.toml') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.11-

      - name: Install dependencies
        # --no-root: the backend is an app, not a published package (and backend/README.md does not exist).
        run: poetry install --no-interaction --no-root

      - name: Lint (ruff)
        run: poetry run ruff check app/

      - name: Test (pytest)
        run: poetry run pytest

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Dummy values so the Next.js build can inline public env vars.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
